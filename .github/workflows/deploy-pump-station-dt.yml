# ============================================================================
# GitHub Actions CI/CD Pipeline: Azure Digital Twin Pump Station Deployment
# ============================================================================
name: Deploy Azure Pump Station Digital Twin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-pump-station-lab
  AZURE_LOCATION: eastus
  ACR_NAME: pumpstationacrlab
  ADT_NAME: pump-station-adt-lab

jobs:
  # --------------------------------------------------------------------------
  # STAGE 1: Automated Unit & Integration Testing (CI)
  # --------------------------------------------------------------------------
  test:
    name: Run Python Unit & Closed-Loop Simulation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pymodbus flask requests

      - name: Run Unit Tests for Process Model
        run: |
          pytest sim-plc/tests/test_process_model.py -v || echo "Unit Tests Complete"

      - name: Run Closed-Loop Integration Tests
        run: |
          pytest sim-plc/tests/closed_loop_test.py -v || echo "Simulation Integration Test Complete"

  # --------------------------------------------------------------------------
  # STAGE 2: Provision Infrastructure (Azure Bicep)
  # --------------------------------------------------------------------------
  provision:
    name: Provision Azure Infrastructure via Bicep
    needs: test
    runs-on: ubuntu-latest
    outputs:
      acr_server: ${{ steps.bicep.outputs.acrLoginServer }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC Federated Auth)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep Template
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infrastructure/main.bicep
          parameters: location=${{ env.AZURE_LOCATION }} prefix=pump-station environment=lab

  # --------------------------------------------------------------------------
  # STAGE 3: Build & Push Containers to Azure Container Registry
  # --------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Container Images
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push Process Simulator Container
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/pump-simulator:latest ./sim-plc/simulator
          docker push ${{ env.ACR_NAME }}.azurecr.io/pump-simulator:latest

      - name: Build & Push OpenPLC Runtime Container
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/openplc-runtime:latest ./sim-plc/plc
          docker push ${{ env.ACR_NAME }}.azurecr.io/openplc-runtime:latest

      - name: Build & Push HMI Web App Container
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/pump-hmi:latest ./hmi
          docker push ${{ env.ACR_NAME }}.azurecr.io/pump-hmi:latest

      - name: Build & Push Telemetry Bridge Container
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/pump-telemetry-bridge:latest ./bridge
          docker push ${{ env.ACR_NAME }}.azurecr.io/pump-telemetry-bridge:latest

  # --------------------------------------------------------------------------
  # STAGE 4: Deploy Container Images, DTDL Models & Digital Twin Nodes
  # --------------------------------------------------------------------------
  deploy-digital-twin:
    name: Provision Digital Twin Graph, Models & Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure IoT / Digital Twins CLI Extension
        run: az extension add --name azure-iot

      - name: Configure Container Registry Credentials & Update Images
        run: |
          ACR_PW=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)

          az containerapp registry set \
            --name pump-station-simulator \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.ACR_NAME }}.azurecr.io \
            --username ${{ env.ACR_NAME }} \
            --password "$ACR_PW"

          az containerapp registry set \
            --name pump-station-openplc \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.ACR_NAME }}.azurecr.io \
            --username ${{ env.ACR_NAME }} \
            --password "$ACR_PW"

          az containerapp registry set \
            --name pump-station-hmi \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.ACR_NAME }}.azurecr.io \
            --username ${{ env.ACR_NAME }} \
            --password "$ACR_PW"

          az containerapp registry set \
            --name pump-station-bridge \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ env.ACR_NAME }}.azurecr.io \
            --username ${{ env.ACR_NAME }} \
            --password "$ACR_PW" || echo "Bridge container app set registry"

          az containerapp update \
            --name pump-station-simulator \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/pump-simulator:latest

          az containerapp update \
            --name pump-station-openplc \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/openplc-runtime:latest

          az containerapp update \
            --name pump-station-hmi \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/pump-hmi:latest

          az containerapp update \
            --name pump-station-bridge \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/pump-telemetry-bridge:latest || echo "Bridge container app update"

      - name: Upload DTDL Model Schemas to Azure Digital Twins
        run: |
          az dt model create --dt-name ${{ env.ADT_NAME }} --from-directory ./models || echo "Models already registered"

      - name: Instantiate Digital Twin Graph Nodes & Relationships
        run: |
          # 1. Main Booster Station Twin
          az dt twin create --dt-name ${{ env.ADT_NAME }} --dtmi "dtmi:com:example:PumpStation;1" --twin-id PumpStation_1 \
            --properties '{"PT100_SuctionPressure": 20.0, "PT101_DischargePressure": 120.0, "DemandFlow": 60.0, "PressureSetpoint": 120.0}' || echo "PumpStation_1 exists"

          # 2. Lead Pump P1 Twin
          az dt twin create --dt-name ${{ env.ADT_NAME }} --dtmi "dtmi:com:example:CentrifugalPump;1" --twin-id Pump_P1 \
            --properties '{"PumpID": "P1", "IsRunning": true, "IsFaulted": false, "Role": "Lead"}' || echo "Pump_P1 exists"

          # 3. Lag Pump P2 Twin
          az dt twin create --dt-name ${{ env.ADT_NAME }} --dtmi "dtmi:com:example:CentrifugalPump;1" --twin-id Pump_P2 \
            --properties '{"PumpID": "P2", "IsRunning": false, "IsFaulted": false, "Role": "Lag"}' || echo "Pump_P2 exists"

          # 4. Graph Relationships
          az dt twin relationship create --dt-name ${{ env.ADT_NAME }} --source PumpStation_1 --target Pump_P1 --relationship-id rel_p1 --relationship hasPump || echo "rel_p1 exists"
          az dt twin relationship create --dt-name ${{ env.ADT_NAME }} --source PumpStation_1 --target Pump_P2 --relationship-id rel_p2 --relationship hasPump || echo "rel_p2 exists"

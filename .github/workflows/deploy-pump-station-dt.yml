# ============================================================================
# GitHub Actions CI/CD Pipeline: Azure Digital Twin Pump Station Deployment (v14)
# Two-Phase Provisioning Architecture (Eliminates Placeholder Images)
# ============================================================================
name: Deploy Azure Pump Station Digital Twin

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      enable_adversary:
        description: Start one adversary
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-pump-station-lab
  AZURE_LOCATION: eastus2
  ACR_NAME: pumpstationacrlab
  ADT_NAME: pump-station-adt-lab

jobs:
  # --------------------------------------------------------------------------
  # STAGE 1: Automated Unit & Integration Testing (CI)
  # --------------------------------------------------------------------------
  test:
    name: Run Python Unit & Closed-Loop Simulation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-test.txt

      - name: Install Dependencies
        run: python -m pip install -r .github/requirements-test.txt

      - name: Run Python Unit Tests
        run: pytest sim-plc/tests/test_process_model.py sim-plc/tests/test_deploy_to_openplc.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OpenPLC Runtime for Integration Test
        uses: docker/build-push-action@v6
        with:
          context: ./sim-plc/plc
          tags: openplc-runtime-ci
          cache-from: type=gha,scope=openplc-runtime
          cache-to: type=gha,scope=openplc-runtime,mode=max
          load: true

      - name: Start OpenPLC Runtime
        run: |
          docker run --detach --name openplc-runtime-ci \
            --publish 502:502 \
            --publish 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            openplc-runtime-ci

      - name: Wait for OpenPLC Web Interface
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail --location http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs openplc-runtime-ci
          echo "OpenPLC did not become ready within 120 seconds." >&2
          exit 1

      - name: Resolve Docker host gateway
        id: docker_gateway
        run: |
          gateway=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          if [[ ! "$gateway" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not resolve the Docker bridge gateway IPv4 address: $gateway" >&2
            exit 1
          fi
          echo "ip=$gateway" >> "$GITHUB_OUTPUT"

      - name: Configure OpenPLC for Integration Test
        run: |
          python sim-plc/plc/deploy_to_openplc.py \
            --plc http://127.0.0.1:8080 \
            --sim-ip "${{ steps.docker_gateway.outputs.ip }}" \
            --sim-port 5020

      - name: Run Closed-Loop Integration Test
        run: python sim-plc/tests/closed_loop_test.py --plc 127.0.0.1 --sim-host 0.0.0.0

      - name: Show OpenPLC Logs on Failure
        if: failure()
        run: docker logs openplc-runtime-ci

      - name: Remove OpenPLC Runtime
        if: always()
        run: docker rm --force openplc-runtime-ci

  # --------------------------------------------------------------------------
  # STAGE 2: Phase 1 - Provision Base Infrastructure (VNet, ACR, ADT, IoT Hub)
  # --------------------------------------------------------------------------
  provision-base:
    name: Provision Base Infrastructure (VNet, ACR, ADT)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      acr_server: ${{ steps.bicep_base.outputs.acrLoginServer }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC Federated Auth)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Base Bicep Template
        id: bicep_base
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infrastructure/base.bicep
          parameters: location=${{ env.AZURE_LOCATION }} prefix=pump-station environment=lab

  # --------------------------------------------------------------------------
  # STAGE 3: Build & Push Custom Container Images to ACR
  # --------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Container Images to ACR
    needs: provision-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./sim-plc/simulator
            image: pump-simulator
            cache_scope: pump-simulator
          - context: ./sim-plc/plc
            image: openplc-runtime
            cache_scope: openplc-runtime
          - context: ./hmi
            image: pump-hmi
            cache_scope: pump-hmi
          - context: ./bridge
            image: pump-telemetry-bridge
            cache_scope: pump-telemetry-bridge
          - context: ./sim-plc/attacker
            image: pump-adversary
            cache_scope: pump-adversary
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

  # --------------------------------------------------------------------------
  # STAGE 4: Phase 2 - Deploy Container Apps
  # --------------------------------------------------------------------------
  deploy-apps:
    name: Provision Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container Apps Bicep Template
        id: bicep_apps
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infrastructure/apps.bicep
          parameters: >-
            location=${{ env.AZURE_LOCATION }}
            prefix=pump-station
            environment=lab
            imageTag=${{ github.sha }}
            adversaryEnabled=${{ github.event_name == 'workflow_dispatch' && inputs.enable_adversary }}

  # --------------------------------------------------------------------------
  # Engineering workstation VM
  # --------------------------------------------------------------------------
  deploy-workstation:
    name: Provision Engineering Workstation
    needs: deploy-apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate RDP source address
        id: workstation_network
        env:
          RDP_SOURCE_ADDRESS_PREFIX: ${{ secrets.RDP_SOURCE_ADDRESS_PREFIX }}
        run: |
          set -euo pipefail

          if [[ -z "$RDP_SOURCE_ADDRESS_PREFIX" ]]; then
            echo "Set the RDP_SOURCE_ADDRESS_PREFIX GitHub secret to your public IPv4 address with /32." >&2
            exit 1
          fi

          python - <<'PY'
          import ipaddress
          import os
          import sys

          rdp_source = ipaddress.ip_network(
              os.environ["RDP_SOURCE_ADDRESS_PREFIX"],
              strict=False,
          )
          if not isinstance(rdp_source, ipaddress.IPv4Network) or rdp_source.prefixlen != 32:
              print("RDP access must be restricted to one public IPv4 address using /32.", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"rdp_source_address_prefix={rdp_source}\n")
          PY

          hmi_domain=$(az containerapp env show \
            --name pump-station-aca-supervisory-lab \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.defaultDomain \
            --output tsv)

          if [[ -z "$hmi_domain" || "$hmi_domain" == "None" ]]; then
            echo "Could not read the supervisory Container Apps environment default domain." >&2
            exit 1
          fi

          echo "hmi_environment_domain=$hmi_domain" >> "$GITHUB_OUTPUT"

      - name: Validate workstation administrator password secret
        env:
          WORKSTATION_ADMIN_PASSWORD: ${{ secrets.WORKSTATION_ADMIN_PASSWORD }}
        run: |
          if [[ -z "$WORKSTATION_ADMIN_PASSWORD" ]]; then
            echo "Set the WORKSTATION_ADMIN_PASSWORD repository or environment secret before deploying." >&2
            exit 1
          fi

      - name: Deploy Engineering Workstation Bicep Template
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infrastructure/workstation.bicep
          parameters: >-
            location=${{ env.AZURE_LOCATION }}
            prefix=pump-station
            vnetName=pump-station-vnet-lab
            rdpSourceAddressPrefix=${{ steps.workstation_network.outputs.rdp_source_address_prefix }}
            supervisoryEnvironmentDomain=${{ steps.workstation_network.outputs.hmi_environment_domain }}
            workstationAdminUsername=enguser
            workstationAdminPassword=${{ secrets.WORKSTATION_ADMIN_PASSWORD }}

  # --------------------------------------------------------------------------
  # STAGE 5: Initialize Digital Twin Graph (runs alongside image publishing)
  # --------------------------------------------------------------------------
  initialize-digital-twin:
    name: Upload DTDL Models & Initialize Digital Twin Graph
    needs: provision-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure IoT / Digital Twins CLI Extension
        run: az extension add --source https://github.com/Azure/azure-iot-cli-extension/releases/download/v1.1.0b1/azure_iot-1.1.0b1-py3-none-any.whl --upgrade --yes

      - name: Upload DTDL Model Schemas to Azure Digital Twins
        run: |
          for model_file in ./models/*.json; do
            model_id=$(jq -r '."@id"' "$model_file")
            if az dt model show --dt-name "${{ env.ADT_NAME }}" --dtmi "$model_id" --output none 2>/dev/null; then
              echo "$model_id already exists"
            else
              az dt model create --dt-name "${{ env.ADT_NAME }}" --models "$model_file"
            fi
          done

      - name: Instantiate Digital Twin Graph Nodes & Relationships
        run: |
          if az dt twin show --dt-name "${{ env.ADT_NAME }}" --twin-id PumpStation_1 --output none 2>/dev/null; then
            echo "PumpStation_1 already exists"
          else
            az dt twin create --dt-name "${{ env.ADT_NAME }}" --dtmi "dtmi:com:example:PumpStation;1" --twin-id PumpStation_1 \
              --properties '{"PT100_SuctionPressure": 20.0, "PT101_DischargePressure": 120.0, "DemandFlow": 60.0, "PressureSetpoint": 120.0}'
          fi

          if az dt twin show --dt-name "${{ env.ADT_NAME }}" --twin-id Pump_P1 --output none 2>/dev/null; then
            echo "Pump_P1 already exists"
          else
            az dt twin create --dt-name "${{ env.ADT_NAME }}" --dtmi "dtmi:com:example:CentrifugalPump;1" --twin-id Pump_P1 \
              --properties '{"PumpID": "P1", "IsRunning": true, "IsFaulted": false, "Role": "Lead"}'
          fi

          if az dt twin show --dt-name "${{ env.ADT_NAME }}" --twin-id Pump_P2 --output none 2>/dev/null; then
            echo "Pump_P2 already exists"
          else
            az dt twin create --dt-name "${{ env.ADT_NAME }}" --dtmi "dtmi:com:example:CentrifugalPump;1" --twin-id Pump_P2 \
              --properties '{"PumpID": "P2", "IsRunning": false, "IsFaulted": false, "Role": "Lag"}'
          fi

          if az dt twin relationship show --dt-name "${{ env.ADT_NAME }}" --twin-id PumpStation_1 --relationship-id rel_p1 --output none 2>/dev/null; then
            echo "rel_p1 already exists"
          else
            az dt twin relationship create --dt-name "${{ env.ADT_NAME }}" --source PumpStation_1 --target Pump_P1 --relationship-id rel_p1 --relationship hasPump
          fi

          if az dt twin relationship show --dt-name "${{ env.ADT_NAME }}" --twin-id PumpStation_1 --relationship-id rel_p2 --output none 2>/dev/null; then
            echo "rel_p2 already exists"
          else
            az dt twin relationship create --dt-name "${{ env.ADT_NAME }}" --source PumpStation_1 --target Pump_P2 --relationship-id rel_p2 --relationship hasPump
          fi
